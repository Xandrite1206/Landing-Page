<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="main-header">
        <a class="logo" href="#">Header Logo</a>
        <nav>
            <ul>
                <li><a class="links" href="#">header link one</a></li>
                <li><a class="links" href="#">header link two</a></li>
                <li><a class="links" href="#">header link three</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>This Website is Awesome!</h1>
                <p>This Website....</p>
                <a href="signup.html" class="button">Sign up</a>
            </div>
            <img src="image.jpg" alt="This is a placeholder for an image">
        </section>

        <section class="information">
            <h2>Some Random Information</h2>
            <div class="img-grid">
                <figure class="card">
                    <img src="image1.jpg" alt="Description of first image">
                    <figcaption>Description</figcaption>
                </figure>
                <figure class="card">
                    <img src="image2.jpg" alt="Description of second image">
                    <figcaption>Description</figcaption>
                </figure>
                <figure class="card">
                    <img src="image3.jpg" alt="Description of third image">
                    <figcaption>Description</figcaption>
                </figure>
                <figure class="card">
                    <img src="image4.jpg" alt="Description of fourth image">
                    <figcaption>Description</figcaption>
                </figure>
            </div>
        </section>

        <div class="quote">
            <blockquote>
                <p>This is an inspiring quote</p>
                <footer>- Thor, God of Thunder</footer>
            </blockquote>
        </div>

        <section class="action">
            <div class="action-box">
                <div class="description">
                    <h2>Call to Action!</h2>
                    <p>It's time</p>
                </div>
                <a href="signup.html" class="button">Sign up</a>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>Copyright © The Odin Project 2026</p>
    </footer>

</body>

</html>
